<!-- App-Symbol nach Markenvorgabe: Vollfassung des Zeichens auf dunklem
     abgerundetem Quadrat mit zehn Prozent Luft.

     Die Luft ist zur sichtbaren Kante gemessen, nicht zur Pfadmitte: die
     Zeichnung liegt im 72er-Raster mit Mittellinien bei 8..64, durch die
     Strichstärke 5 reicht sie sichtbar aber von 5.5 bis 66.5. Dieser
     Bereich wird auf 7.2..64.8 gelegt, also je zehn Prozent Rand. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72"><rect width="72" height="72" rx="16" fill="#121417"/><g transform="translate(2.007 2.007) scale(0.94426)"><path d="M8 24 V8 H24" fill="none" stroke="#9AE34D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 8 H64 V24" fill="none" stroke="#9AE34D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M64 48 V64 H48" fill="none" stroke="#9AE34D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 64 H8 V48" fill="none" stroke="#9AE34D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 36 H50" stroke="#F2F4EF" stroke-width="3.5" stroke-linecap="round"/><circle cx="36" cy="36" r="7.5" fill="none" stroke="#F2F4EF" stroke-width="3.5"/><circle cx="36" cy="36" r="2" fill="#F2F4EF"/><path d="M27 8 V17 H45 V8" fill="none" stroke="#F2F4EF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M27 64 V55 H45 V64" fill="none" stroke="#F2F4EF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
