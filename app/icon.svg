<!-- App-Symbol: das Zeichen wie in der Kopfzeile — Ecken in Grün, Linien
     in Dunkel auf hellem, abgerundetem Quadrat, zehn Prozent Luft.

     Die Luft ist zur sichtbaren Kante gemessen, nicht zur Pfadmitte: die
     Zeichnung liegt im 72er-Raster mit Mittellinien bei 8..64, durch die
     Strichstärke 5 reicht sie sichtbar aber von 5.5 bis 66.5. Dieser
     Bereich wird auf 7.2..64.8 gelegt, also je zehn Prozent Rand. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72"><rect width="72" height="72" rx="16" fill="#F2F4EF"/><g transform="translate(2.007 2.007) scale(0.94426)"><path d="M8 24 V8 H24" fill="none" stroke="#4E8A1B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 8 H64 V24" fill="none" stroke="#4E8A1B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M64 48 V64 H48" fill="none" stroke="#4E8A1B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 64 H8 V48" fill="none" stroke="#4E8A1B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 36 H50" stroke="#121417" stroke-width="4.5" stroke-linecap="round"/><circle cx="36" cy="36" r="8" fill="none" stroke="#121417" stroke-width="4.5"/></g></svg>
